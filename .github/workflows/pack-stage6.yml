name: Paket Tahap 6 Manajemen Pengguna
on:
  push:
    branches: [main]
    paths:
      - 'public_html/pasang-tahap6.php'
      - 'public_html/kelola-pengguna.php'
      - 'public_html/assets/pasang-tahap6.css'
      - 'public_html/assets/kelola-pengguna.css'
      - 'public_html/super-admin.php'
      - 'public_html/direktori-akun.php'
      - 'portal_private/account_control.php'
      - '.github/workflows/pack-stage6.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smartcikoko-package-stage6
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - name: Validasi sintaks berkas PHP Tahap 6
        shell: bash
        run: |
          set -euo pipefail
          for f in public_html/pasang-tahap6.php public_html/kelola-pengguna.php portal_private/account_control.php public_html/super-admin.php public_html/direktori-akun.php; do
            php -l "$f"
          done
      - name: Siapkan ZIP pembaruan kecil, tanpa data pribadi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/public_html/assets staging/portal_private paket
          cp portal_private/account_control.php staging/portal_private/
          cp public_html/pasang-tahap6.php public_html/kelola-pengguna.php staging/public_html/
          cp public_html/super-admin.php public_html/direktori-akun.php staging/public_html/
          cp public_html/assets/pasang-tahap6.css public_html/assets/kelola-pengguna.css staging/public_html/assets/
          cp public_html/assets/super-admin.css public_html/assets/direktori-akun.css staging/public_html/assets/
          cat > staging/BACA-TAHAP6.txt <<'HELP'
          TAHAP 6 — MANAJEMEN PENGGUNA SMARTCIKOKO
          1. Backup file portal_private/bootstrap.php dan portal_private/auth.php serta dua database.
          2. Upload ZIP di /home/datd1747/ via cPanel File Manager, lalu Extract.
          3. Login sebagai SUPER ADMIN.
          4. Buka https://datawebs.my.id/pasang-tahap6.php
          5. Klik "Pasang Manajemen Pengguna".
          6. Buka https://datawebs.my.id/kelola-pengguna.php
          7. Uji akun biasa ditolak. Uji akses akun uji yang diblokir.
          8. Hapus public_html/pasang-tahap6.php dan ZIP dari hosting.
          TIDAK PERLU MENJALANKAN SQL, tidak mengubah data akun lama.
          HELP
          (cd staging && zip -q -X -r ../paket/SmartCikoko-TAHAP6-MANAJEMEN.zip .)
          unzip -t paket/SmartCikoko-TAHAP6-MANAJEMEN.zip
      - name: Publikasikan ZIP di GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paket/SmartCikoko-TAHAP6-MANAJEMEN.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish SmartCikoko Stage 6 cPanel ZIP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCikoko-TAHAP6-MANAJEMEN
          path: paket/SmartCikoko-TAHAP6-MANAJEMEN.zip
          retention-days: 30
