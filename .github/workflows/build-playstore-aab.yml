name: Build Google Play Signed AAB (manual, API 36)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android project
        working-directory: android_flutter
        run: |
          set -euo pipefail
          flutter create --org id.smartcikoko --project-name smartcikoko --platforms android .
          rm -f test/widget_test.dart
          flutter pub get

      - name: Apply Smart Cikoko identity
        run: python3 scripts/brand_flutter_android.py android_flutter

      - name: Configure Play signing Firebase and API 36
        env:
          SC_PLAY_KEYSTORE_BASE64: ${{ secrets.SC_PLAY_KEYSTORE_BASE64 }}
          SC_PLAY_STORE_PASSWORD: ${{ secrets.SC_PLAY_STORE_PASSWORD }}
          SC_PLAY_KEY_ALIAS: ${{ secrets.SC_PLAY_KEY_ALIAS }}
          SC_PLAY_KEY_PASSWORD: ${{ secrets.SC_PLAY_KEY_PASSWORD }}
          SC_FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.SC_FIREBASE_ANDROID_JSON_BASE64 }}
        run: python3 scripts/prepare_flutter_play.py android_flutter

      - name: Validate Dart and widget tests
        working-directory: android_flutter
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build signed Android App Bundle
        working-directory: android_flutter
        env:
          SC_PLAY_STORE_PASSWORD: ${{ secrets.SC_PLAY_STORE_PASSWORD }}
          SC_PLAY_KEY_ALIAS: ${{ secrets.SC_PLAY_KEY_ALIAS }}
          SC_PLAY_KEY_PASSWORD: ${{ secrets.SC_PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release
          flutter build apk --release --target-platform android-arm64
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signed Android archives and release identity
        shell: bash
        working-directory: android_flutter
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          python3 ../scripts/security_scan_android.py \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            "$APKSIGNER" "$AAPT"
      - name: Install ClamAV and update detection signatures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
      - name: Malware scan signed AAB and APK (fail closed)
        working-directory: android_flutter
        shell: bash
        run: |
          set -euo pipefail
          clamscan --scan-archive=yes --infected --max-filesize=300M \
            --max-scansize=2000M --max-recursion=40 \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab
          echo 'ClamAV scan completed without detected signatures.' >> security-report.txt
      - name: Upload security inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartCikoko-Play-Security-Report
          if-no-files-found: warn
          retention-days: 14
          path: android_flutter/security-report.txt
      - name: Upload AAB artifact for manual Play Console submission
        uses: actions/upload-artifact@v4
        with:
          name: SmartCikoko-Play-API36-Signed-AAB
          path: android_flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
