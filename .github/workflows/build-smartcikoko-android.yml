name: Build SmartCikoko Android APK ARM64 and AAB
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_flutter/**'
      - '.github/workflows/build-smartcikoko-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android platform if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --org id.smartcikoko --platforms android --project-name smartcikoko .
            rm -f test/widget_test.dart
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Flutter code before Gradle release build
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build APK ARM64
        run: flutter build apk --release --target-platform android-arm64
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Verify outputs
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
      - name: Validate APK and AAB structure and signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          python3 ../scripts/security_scan_android.py "$APK" "$AAB" "$APKSIGNER" "$AAPT"
      - name: Install ClamAV and update detection signatures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
      - name: Malware scan APK and AAB (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          clamscan --scan-archive=yes --infected --max-filesize=300M \
            --max-scansize=2000M --max-recursion=40 \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab
          echo 'ClamAV scan completed without detected signatures.' >> security-report.txt
      - name: Upload security inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartCikoko-Android-Security-Report
          if-no-files-found: warn
          retention-days: 14
          path: android_flutter/security-report.txt
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SmartCikoko-Android-APK-ARM64-AAB
          if-no-files-found: error
          retention-days: 14
          path: |
            android_flutter/build/app/outputs/flutter-apk/app-release.apk
            android_flutter/build/app/outputs/bundle/release/app-release.aab
