name: Paket Tahap 15 Pusat Laporan Terpadu
on:
  push:
    branches: [main]
    paths:
      - 'portal_private/unified_reports.php'
      - 'public_html/pusat-laporan.php'
      - 'public_html/super-admin-satu.php'
      - 'public_html/instal-laporan.php'
      - 'public_html/assets/pusat-laporan.css'
      - 'public_html/assets/super-admin-satu.css'
      - 'tests/stage15-reports.php'
      - '.github/workflows/pack-stage15.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smartcikoko-stage15-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          tools: none
      - name: Periksa sintaks semua file Tahap 15
        shell: bash
        run: |
          set -euo pipefail
          for f in portal_private/unified_reports.php public_html/pusat-laporan.php public_html/super-admin-satu.php public_html/instal-laporan.php; do
            php -l "$f"
          done
      - name: Uji pembatasan kategori dan validasi tanpa database produksi
        run: php tests/stage15-reports.php
      - name: Uji struktur CSS dan PHP kompatibilitas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for f in ['public_html/assets/pusat-laporan.css','public_html/assets/super-admin-satu.css']:
              css=Path(f).read_text()
              assert css.count('{')==css.count('}'), f
              assert '@media' in css, f
          print('CSS responsive consistency checks passed')
          PY
      - name: Bentuk satu ZIP aman untuk cPanel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage15_installer
          mkdir -p stage15_installer/portal_private stage15_installer/public_html/assets paket
          cp portal_private/unified_reports.php stage15_installer/portal_private/
          cp public_html/pusat-laporan.php public_html/super-admin-satu.php public_html/instal-laporan.php stage15_installer/public_html/
          cp public_html/assets/pusat-laporan.css public_html/assets/super-admin-satu.css stage15_installer/public_html/assets/
          cat > stage15_installer/BACA-TAHAP15.txt <<'HELP'
          SMARTCIKOKO TAHAP 15 - SUPER ADMIN RINGKAS DAN PUSAT LAPORAN
          1. Backup website dan dua database serta kunci MFA di lokasi privat.
          2. Upload ZIP ke /home/datd1747/ dan Extract di direktori tersebut.
          3. Login Super Admin dengan kode autentikator.
          4. Buka https://datawebs.my.id/instal-laporan.php
          5. Klik Aktifkan Pusat Laporan. Tidak perlu SQL manual.
          6. Dashboard ringkas: https://datawebs.my.id/super-admin-satu.php
          7. Form input: https://datawebs.my.id/pusat-laporan.php
          8. Uji dengan akun dummy sesuai peran.
          9. Hapus public_html/instal-laporan.php dan ZIP sesudah sukses.
          File index.php, super-admin.php, bootstrap.php, auth.php, mfa.php tidak ditimpa.
          Laporan ringkas baru terpisah dari tabel/form resmi lama.
          HELP
          rm -f paket/SmartCikoko-TAHAP15-PUSAT-LAPORAN.zip
          (cd stage15_installer && zip -q -X -r ../paket/SmartCikoko-TAHAP15-PUSAT-LAPORAN.zip .)
          unzip -t paket/SmartCikoko-TAHAP15-PUSAT-LAPORAN.zip
          for f in portal_private/unified_reports.php public_html/pusat-laporan.php public_html/super-admin-satu.php public_html/instal-laporan.php public_html/assets/pusat-laporan.css public_html/assets/super-admin-satu.css; do
            unzip -Z1 paket/SmartCikoko-TAHAP15-PUSAT-LAPORAN.zip | grep -Fxq "$f"
          done
          if unzip -Z1 paket/SmartCikoko-TAHAP15-PUSAT-LAPORAN.zip | grep -Eq '(^|/)(index|bootstrap|auth|config|super_admin|mfa|super-admin)\.php$'; then
            echo "ERROR: existing authentication and dashboard PHP must not be overwritten"
            exit 1
          fi
      - name: Publikasikan ZIP di GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paket/SmartCikoko-TAHAP15-PUSAT-LAPORAN.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish SmartCikoko Stage 15 cPanel report center ZIP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCikoko-TAHAP15-PUSAT-LAPORAN
          path: paket/SmartCikoko-TAHAP15-PUSAT-LAPORAN.zip
          retention-days: 30
