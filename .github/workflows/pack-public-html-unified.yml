name: PUBLIC_HTML BARU — SmartCikoko Unified
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_clean_public_html.py'
      - 'tests/clean-webroot.py'
      - 'public_html/index.php'
      - 'public_html/assets/portal-mockup.css'
      - 'public_html/assets/cikoko-office-illustration.svg'
      - 'portal_private/mobile_forms_api.php'
      - 'public_html/api/mobile-forms.php'
      - 'public_html/api/citizen-upload.php'
      - 'public_html/aktivitas-terpadu.php'
      - 'public_html/assets/aktivitas-terpadu.css'
      - 'portal_private/workflow_progress.php'
      - 'portal_private/workflow_feed.php'
      - 'portal_private/citizen_followup.php'
      - 'tests/workflow-progress.php'
      - 'public_html/assets/site-public-v3.css'
      - 'public_html/assets/ui-modern.css'
      - 'public_html/assets/ui-modern.js'
      - 'public_html/assets/admin-modern.js'
      - 'docs/PUBLIC-HTML-BARU-UNIFIED.md'
      - '.github/workflows/pack-public-html-unified.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smartcikoko-unified-clean-root
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite
          tools: none
      - name: Build safe public_html_baru without touching current website
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_clean_public_html.py --output _webroot_replacement
          cp docs/PUBLIC-HTML-BARU-UNIFIED.md _webroot_replacement/BACA-SEBELUM-GANTI.txt
          mkdir -p _webroot_replacement/portal_private
          cp portal_private/mobile_forms_api.php _webroot_replacement/portal_private/mobile_forms_api.php
          cp portal_private/workflow_progress.php _webroot_replacement/portal_private/workflow_progress.php
          cp portal_private/workflow_feed.php _webroot_replacement/portal_private/workflow_feed.php
          mkdir -p _webroot_replacement/PRIVATE-PATCH-REVIEW
          cp portal_private/citizen_followup.php _webroot_replacement/PRIVATE-PATCH-REVIEW/citizen_followup.php
          php -l _webroot_replacement/portal_private/mobile_forms_api.php
          php -l _webroot_replacement/portal_private/workflow_progress.php
          php -l _webroot_replacement/portal_private/workflow_feed.php
          php -l _webroot_replacement/PRIVATE-PATCH-REVIEW/citizen_followup.php
      - name: Verify all active routes, one admin and sticky header/bottom footer
        run: python3 tests/clean-webroot.py _webroot_replacement
      - name: PHP lint for EVERY generated webroot PHP file
        shell: bash
        run: |
          set -euo pipefail
          find _webroot_replacement/public_html_baru -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
      - name: JavaScript syntax for same-origin admin tools
        shell: bash
        run: |
          set -euo pipefail
          node --check _webroot_replacement/public_html_baru/assets/ui-modern.js
          node --check _webroot_replacement/public_html_baru/assets/admin-modern.js
      - name: Regression tests of real report intake, form auth and operational dashboard
        shell: bash
        run: |
          set -euo pipefail
          php tests/workflow-progress.php
          php tests/stage16-forms.php
          php tests/stage23-hub.php
          php tests/compact-ui.php
          php tests/stage25-operational.php
      - name: Package complete clean root in a separate staging folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paket
          rm -f paket/SmartCikoko-WEBSITE-MOCKUP-V4.zip
          (cd _webroot_replacement && zip -q -X -r ../paket/SmartCikoko-WEBSITE-MOCKUP-V4.zip public_html_baru portal_private PRIVATE-PATCH-REVIEW BACA-SEBELUM-GANTI.txt MANIFEST-DEPLOY.json)
          unzip -t paket/SmartCikoko-WEBSITE-MOCKUP-V4.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('paket/SmartCikoko-WEBSITE-MOCKUP-V4.zip')
          with zipfile.ZipFile(archive) as z:
              names={x for x in z.namelist() if not x.endswith('/')}
              assert 'public_html_baru/index.php' in names
              assert 'public_html_baru/.htaccess' in names
              assert 'public_html_baru/api/index.php' in names
              assert 'public_html_baru/super-admin-satu.php' in names
              assert 'public_html_baru/assets/ui-modern.css' in names
              assert 'public_html_baru/assets/portal-mockup.css' in names
              assert 'public_html_baru/assets/cikoko-office-illustration.svg' in names
              assert 'public_html_baru/api/mobile-forms.php' in names
              assert 'portal_private/mobile_forms_api.php' in names
              assert 'portal_private/workflow_progress.php' in names
              assert 'portal_private/workflow_feed.php' in names
              assert 'PRIVATE-PATCH-REVIEW/citizen_followup.php' in names
              assert 'public_html_baru/api/citizen-upload.php' in names
              assert 'public_html_baru/aktivitas-terpadu.php' in names
              assert 'public_html_baru/assets/admin-modern.js' in names
              assert 'MANIFEST-DEPLOY.json' in names
              assert 'BACA-SEBELUM-GANTI.txt' in names
              assert not any(x.startswith('public_html/') for x in names)
              assert {x for x in names if x.startswith('portal_private/')}=={
                  'portal_private/mobile_forms_api.php','portal_private/workflow_progress.php',
                  'portal_private/workflow_feed.php'}
              assert not any('/instal-' in x or '/perbaiki-' in x for x in names)
              assert len(names)>=65,len(names)
          print('ZIP stages new private helpers; existing citizen_followup.php is review-only and NEVER automatically overwritten')
          PY
          du -h paket/SmartCikoko-WEBSITE-MOCKUP-V4.zip
      - name: Build small two-file homepage repair for already deployed V1 sites
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _homepage_hotfix
          mkdir -p _homepage_hotfix/public_html/assets
          cp _webroot_replacement/public_html_baru/index.php _homepage_hotfix/public_html/index.php
          cp _webroot_replacement/public_html_baru/assets/portal-mockup.css _homepage_hotfix/public_html/assets/portal-mockup.css
          cp _webroot_replacement/public_html_baru/assets/cikoko-office-illustration.svg _homepage_hotfix/public_html/assets/cikoko-office-illustration.svg
          cat > _homepage_hotfix/BACA-PERBAIKAN-BERANDA.txt <<'HELP'
          SMARTCIKOKO — BERANDA MOCKUP V4
          Masalah: header bertumpuk, tombol polos, kartu kanan kosong.
          Penyebab: beranda lama masih mengandalkan CSS lama yang dapat
          tidak terambil atau konflik dengan tema modern.
          Perbaikan ini memuat stylesheet halaman publik mandiri.

          UNTUK SITUS YANG SUDAH MENGGUNAKAN PAKET V1:
          1. Backup public_html/index.php di luar webroot.
          2. CPanel File Manager: Upload ZIP di /home/datd1747/.
          3. Extract di /home/datd1747/ dan izinkan overwrite HANYA
             public_html/index.php.
             File portal-mockup.css dan cikoko-office-illustration.svg adalah aset BARU.
          4. Buka https://datawebs.my.id/?page=beranda&v=4
          5. Periksa header, tombol, panel akses cepat, layanan, footer,
             ponsel dan desktop. Ctrl+F5 bila perlu.
          6. Jika ada masalah, restore index.php dari backup.
          JANGAN hapus portal_private, database, unggahan, atau MFA.
          Paket ini khusus Beranda/halaman yang ditangani index.php;
          untuk seluruh rute gunakan WEBSITE-MOCKUP-V4 setelah uji.
          HELP
          (cd _homepage_hotfix && zip -q -X -r ../paket/SmartCikoko-BERANDA-MOCKUP-V4.zip .)
          unzip -t paket/SmartCikoko-BERANDA-MOCKUP-V4.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('paket/SmartCikoko-BERANDA-MOCKUP-V4.zip') as z:
              files={name for name in z.namelist() if not name.endswith('/')}
              assert files=={
                  'public_html/index.php',
                  'public_html/assets/portal-mockup.css',
                  'public_html/assets/cikoko-office-illustration.svg',
                  'BACA-PERBAIKAN-BERANDA.txt'
              },files
              html=z.read('public_html/index.php')
              assert b'/assets/portal-mockup.css?v=20261110b' in html
              assert b'class="hero-art"' in html
          print('V4 mockup replaces one existing PHP and adds CSS and illustration.')
          PY
      - name: Publish verified complete staging ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paket/SmartCikoko-WEBSITE-MOCKUP-V4.zip paket/SmartCikoko-BERANDA-MOCKUP-V4.zip
          if ! git diff --cached --quiet; then
            git commit -m "Release full SmartCikoko unified clean public_html staging ZIP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCikoko-PUBLIC-HTML-BARU-V2
          path: |
            paket/SmartCikoko-WEBSITE-MOCKUP-V4.zip
            paket/SmartCikoko-BERANDA-MOCKUP-V4.zip
          retention-days: 30
