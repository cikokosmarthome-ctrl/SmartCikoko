name: Verifikasi Sintaks PHP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - name: Validate PHP syntax
        run: |
          find public_html portal_private tools -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Ensure no private uploads or secrets tracked
        run: |
          if git ls-files | grep -E '(^|/)(config\.php|portal_users\.json|admin\.json|\.env)$|\.(pem|key|jks|keystore)$'; then
            echo "Berkas pribadi atau kredensial tidak boleh berada dalam GitHub."
            exit 1
          fi